<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Millions — Boss Hunt · Recent Activity</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;900&family=Barlow+Condensed:wght@400;600&family=IM+Fell+English:ital@1&display=swap" rel="stylesheet">
<style>
:root{
  --void:#06070a; --ink:#0b0d12; --panel:#11141a;
  --gold:#c9a227; --gold-hi:#eed595; --gold-lo:#5c4810;
  --parch:#c4bca8; --dim:#7a7365; --line:#201c14;
  --team-1:#c9a227; --team-2:#7190b6; --team-3:#a63f2c;
  --good:#4caf50; --bad:#a63f2c;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:radial-gradient(100% 30% at 50% 0%, rgba(201,162,39,.08), rgba(201,162,39,0) 60%),
    linear-gradient(#080a0e, var(--void) 45%, #040507 100%);
  background-repeat:no-repeat;
  color:var(--parch); font-family:'Barlow Condensed',system-ui,sans-serif;
  -webkit-font-smoothing:antialiased; min-height:100vh;
}
.wrap{max-width:1080px;margin:0 auto;padding:0 24px 64px}
.mast{padding:38px 0 0;text-align:center}
.mast .clan{font-family:'Cinzel',serif;font-weight:900;font-size:15px;letter-spacing:.4em;text-indent:.4em;color:var(--gold)}
.mast .ev{font-family:'Cinzel',serif;font-weight:900;font-size:28px;line-height:1;margin-top:8px;text-transform:uppercase;letter-spacing:.05em;
  background:linear-gradient(178deg,#fdf2d6 6%,var(--gold-hi) 40%,var(--gold) 64%,#7d6214 98%);-webkit-background-clip:text;background-clip:text;color:transparent}
.mastrule{margin-top:16px;height:1px;background:linear-gradient(90deg,transparent,var(--gold-lo) 12%,var(--gold) 50%,var(--gold-lo) 88%,transparent)}
.refresh-bar{display:flex;justify-content:center;align-items:center;gap:12px;margin-top:14px;flex-wrap:wrap}
.refresh-btn{font-family:'Cinzel',serif;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold-lo);background:var(--panel);cursor:pointer;border:1px solid var(--gold-lo);padding:6px 16px;border-radius:3px;transition:all .15s}
.refresh-btn:hover{color:var(--gold-hi);border-color:var(--gold-hi)}
.refresh-btn:disabled{opacity:.5;cursor:default}
#lastUpdated{font-size:12px;letter-spacing:.08em;color:var(--dim);text-transform:uppercase}
#lastUpdated.stale{color:var(--bad)}
.top-nav{text-align:center;margin-top:10px}
.top-nav a{font-family:'Cinzel',serif;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold-lo);text-decoration:none;border-bottom:1px solid var(--gold-lo)}
.top-nav a:hover{color:var(--gold-hi);border-color:var(--gold-hi)}

h2.sec{font-family:'Cinzel',serif;font-weight:900;font-size:22px;text-transform:uppercase;letter-spacing:.13em;color:#ddd1b1;margin:40px 0 4px}
.sec-rule{height:1px;background:linear-gradient(90deg,var(--gold),rgba(0,0,0,0) 55%);margin-bottom:22px}

table.log{width:100%;border-collapse:collapse;font-size:16px}
table.log th{font-family:'Cinzel',serif;font-weight:600;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:#8b8371;text-align:left;padding:0 10px 10px;border-bottom:1px solid var(--line)}
table.log td{padding:9px 10px;border-bottom:1px solid #14110c;color:#cbc1a8;vertical-align:middle}
table.log tr:last-child td{border-bottom:none}
.pill{display:inline-block;font-size:12px;letter-spacing:.12em;text-transform:uppercase;padding:3px 9px;border:1px solid var(--tc);color:var(--tc);white-space:nowrap}
td.pts{font-family:'Cinzel',serif;font-weight:900;color:var(--gold-hi);text-align:right;white-space:nowrap}
td.when{color:#8b8371;font-size:14px;white-space:nowrap}
.rsn{color:var(--gold-hi);font-weight:600}
.tag{font-size:10px;letter-spacing:.08em;text-transform:uppercase;padding:1px 6px;border-radius:2px;margin-left:6px;background:#1a1408;border:1px solid #5c4810;color:#c9a227}
.empty{padding:40px 0;text-align:center;color:#5c5648;font-family:'IM Fell English',serif;font-style:italic;font-size:17px}

footer{margin-top:50px;text-align:center}
footer .mark{font-family:'Cinzel',serif;font-weight:900;font-size:16px;letter-spacing:.42em;text-indent:.42em;color:var(--gold)}
@media (max-width:640px){ table.log .hide-sm{display:none} }
</style>
</head>
<body>
<div class="wrap">

  <header class="mast">
    <div class="clan">MILLIONS</div>
    <div class="ev">Recent Activity</div>
  </header>
  <div class="mastrule"></div>
  <div class="refresh-bar"><button class="refresh-btn" id="refreshBtn">↻ Refresh</button><span id="lastUpdated">Loading…</span></div>
  <nav class="top-nav"><a href="/boss-hunt-2026">← Back to Standings</a> &nbsp;·&nbsp; <a href="/boss-hunt-bounties-2026">Bounties →</a></nav>

  <h2 class="sec">Recent Drops</h2>
  <div class="sec-rule"></div>
  <div id="logWrap"></div>

  <footer>
    <div class="mark">MILLIONS</div>
  </footer>
</div>

<script>
const TEAMS = ["Millions", "Zero"];
const TEAM_COLORS = { "Millions": "var(--team-1)", "Zero": "var(--team-2)" };

const $ = id => document.getElementById(id);
const fmtNum = n => Math.round(n).toLocaleString();

let CONFIG = null;
async function loadSharedData(){
  CONFIG = await (await fetch('/boss-hunt-config-2026.json')).json();
}

const BOSS_MAP = {};
function findItem(bossName, itemName) {
  const b = BOSS_MAP[bossName];
  if (!b) return null;
  return b.displayItems.find(d => d.kind === 'item' && d.name === itemName) || null;
}

let STATE = { kph: {}, manualAdjustments: {}, drops: [] };

function effectiveKPH(bossName) {
  if (STATE.kph[bossName] != null) return STATE.kph[bossName];
  const b = BOSS_MAP[bossName];
  return b ? b.actualKPH : null;
}
function effectiveManualAdjustment(bossName, item) {
  const key = bossName + '||' + item.name;
  if (STATE.manualAdjustments && STATE.manualAdjustments[key] != null) return STATE.manualAdjustments[key];
  return item.manualAdjustment;
}
function itemPointValue(bossName, item) {
  const kph = effectiveKPH(bossName);
  if (!kph || !item.dropRate) return null;
  const base = 1 / item.dropRate;
  return base * (CONFIG.assumptions.kphNormalizationConstant / kph) * effectiveManualAdjustment(bossName, item);
}

function ago(ts) {
  const s = Math.floor((Date.now() - ts) / 1000);
  if (s < 60) return s + 's ago';
  if (s < 3600) return Math.floor(s/60) + 'm ago';
  if (s < 86400) return Math.floor(s/3600) + 'h ago';
  return Math.floor(s/86400) + 'd ago';
}

function render() {
  // ---- Recent drops log ----
  // Copy numbers (for the graduated dupe discount) need to be computed in
  // chronological order across ALL teams' drops for a given boss+item+team,
  // then looked up by id when rendering in the newest-first display order.
  const copyNumberById = {};
  const dupeCounts = {};
  for (const d of [...STATE.drops].sort((a, b) => a.loggedAt - b.loggedAt)) {
    const key = d.team + '||' + d.boss + '||' + d.item;
    dupeCounts[key] = (dupeCounts[key] || 0) + 1;
    copyNumberById[d.id] = dupeCounts[key];
  }
  function dupeDiscountMultiplier(copyNumber) {
    const tiers = [1.0, 0.9, 0.8, 0.7, 0.6];
    return tiers[Math.min(copyNumber - 1, tiers.length - 1)];
  }

  const allDrops = [...STATE.drops].sort((a, b) => b.loggedAt - a.loggedAt).slice(0, 150);
  if (!allDrops.length) {
    $('logWrap').innerHTML = '<div class="empty">No drops logged yet.</div>';
  } else {
    $('logWrap').innerHTML = '<table class="log"><tbody>' + allDrops.map(d => {
      const item = findItem(d.boss, d.item);
      const pv = item ? itemPointValue(d.boss, item) : null;
      const pts = pv != null ? pv * d.quantity * dupeDiscountMultiplier(copyNumberById[d.id]) : null;
      return `<tr>
        <td class="when hide-sm">${ago(d.loggedAt)}</td>
        <td><span class="pill" style="--tc:${TEAM_COLORS[d.team]}">${d.team}</span></td>
        <td>${d.rsn ? `<span class="rsn">${d.rsn}</span> — ` : ''}${d.item}</td>
        <td class="hide-sm">${d.boss}</td>
        <td class="pts">${pts != null ? '+' + fmtNum(pts) : '—'}</td>
      </tr>`;
    }).join('') + '</tbody></table>';
  }
}

// ---- Manual refresh ----
let lastStateJSON = null;

function formatUpdatedAt(d) {
  return d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
}

async function poll() {
  $('refreshBtn').disabled = true;
  try {
    const r = await fetch('/api/state', { cache: 'no-store' });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const newState = await r.json();
    const newStateJSON = JSON.stringify(newState);
    if (newStateJSON !== lastStateJSON) {
      const scrollY = window.scrollY;
      STATE = newState;
      lastStateJSON = newStateJSON;
      render();
      window.scrollTo(0, scrollY);
    }
    $('lastUpdated').classList.remove('stale');
    $('lastUpdated').textContent = 'Updated ' + formatUpdatedAt(new Date());
  } catch (e) {
    $('lastUpdated').classList.add('stale');
    $('lastUpdated').textContent = 'Refresh failed — try again';
  }
  $('refreshBtn').disabled = false;
}
async function init(){
  await loadSharedData();
  CONFIG.bosses.forEach(b => BOSS_MAP[b.boss] = b);
  await poll();
  $('refreshBtn').onclick = poll;
}
init();
</script>
</body>
</html>
