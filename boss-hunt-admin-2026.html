<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Millions — Boss Hunt · Admin</title>
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;900&family=Barlow+Condensed:wght@400;600&family=IM+Fell+English:ital@1&display=swap" rel="stylesheet">
<style>
:root{
  --void:#06070a; --ink:#0b0d12; --panel:#11141a;
  --gold:#c9a227; --gold-hi:#eed595; --gold-lo:#5c4810;
  --parch:#c4bca8; --dim:#7a7365; --line:#201c14;
  --good:#4caf50; --bad:#a63f2c;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:radial-gradient(100% 30% at 50% 0%, rgba(201,162,39,.08), rgba(201,162,39,0) 60%),
    linear-gradient(#080a0e, var(--void) 45%, #040507 100%);
  background-repeat:no-repeat;
  color:var(--parch); font-family:'Barlow Condensed',system-ui,sans-serif;
  -webkit-font-smoothing:antialiased; min-height:100vh;
}
.wrap{max-width:900px;margin:0 auto;padding:0 24px 64px}
.mast{padding:32px 0 0;text-align:center}
.mast .clan{font-family:'Cinzel',serif;font-weight:900;font-size:15px;letter-spacing:.4em;text-indent:.4em;color:var(--gold)}
.mast .ev{font-family:'Cinzel',serif;font-weight:900;font-size:26px;line-height:1;margin-top:8px;text-transform:uppercase;letter-spacing:.05em;
  background:linear-gradient(178deg,#fdf2d6 6%,var(--gold-hi) 40%,var(--gold) 64%,#7d6214 98%);-webkit-background-clip:text;background-clip:text;color:transparent}
.mastrule{margin-top:16px;height:1px;background:linear-gradient(90deg,transparent,var(--gold-lo) 12%,var(--gold) 50%,var(--gold-lo) 88%,transparent)}
nav.top{display:flex;justify-content:center;gap:20px;margin-top:10px}
nav.top a{font-family:'Cinzel',serif;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);text-decoration:none}
nav.top a:hover{color:var(--gold-hi)}

h2.sec{font-family:'Cinzel',serif;font-weight:900;font-size:20px;text-transform:uppercase;letter-spacing:.12em;color:#ddd1b1;margin:36px 0 4px}
.sec-rule{height:1px;background:linear-gradient(90deg,var(--gold),rgba(0,0,0,0) 55%);margin-bottom:18px}

.card{background:linear-gradient(#11141a,#0a0c10);border:1px solid #1f1b13;border-top:1px solid #302719;padding:22px 20px;margin-bottom:16px}
label{display:block;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#6b6558;margin-bottom:6px;font-weight:600}
input,select,button{font-family:'Barlow Condensed',system-ui,sans-serif;font-size:16px}
input,select{width:100%;background:#0a0c10;border:1px solid #2a2418;color:#e2d8bd;padding:10px 11px;outline:none}
input:focus,select:focus{border-color:var(--gold)}
.field{margin-bottom:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
button{background:linear-gradient(#1a1610,#0f0d09);border:1px solid var(--gold-lo);color:var(--gold-hi);
  padding:11px 22px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;cursor:pointer;font-family:'Cinzel',serif;font-size:13px}
button:hover{border-color:var(--gold);color:#fff6d8}
button:disabled{opacity:.45;cursor:not-allowed}
button.ghost{background:none;border-color:#2a2418;color:#6b6558;padding:6px 12px;font-size:11px}
button.ghost:hover{border-color:var(--bad);color:#c0705f}
button.small{padding:6px 12px;font-size:11px}
label.chk{display:flex;align-items:center;gap:8px;font-size:14px;letter-spacing:.02em;text-transform:none;color:var(--parch);cursor:pointer}
label.chk input{width:auto}

.msg{margin-top:14px;padding:10px 13px;font-size:15px;border-left:2px solid}
.msg.ok{border-color:var(--good);color:#8fbf92;background:rgba(76,175,80,.07)}
.msg.err{border-color:var(--bad);color:#c0705f;background:rgba(166,63,44,.08)}

table.list{width:100%;border-collapse:collapse;font-size:14px}
table.list th{font-family:'Cinzel',serif;font-weight:600;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:#8b8371;text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
table.list td{padding:7px 8px;border-bottom:1px solid #14110c;color:#cbc1a8;vertical-align:middle}
table.list input[type=number]{width:80px;padding:5px 7px;font-size:14px}
.kph-row.dirty td{background:rgba(201,162,39,.06)}
.empty{padding:24px 0;text-align:center;color:#5c5648;font-family:'IM Fell English',serif;font-style:italic;font-size:16px}

.bounty-admin{background:linear-gradient(#12151b,#0a0c10);border:1px solid var(--line);border-top:2px solid var(--gold-lo);padding:14px 16px;margin-bottom:10px}
.bounty-admin .bnum{font-family:'Cinzel',serif;font-weight:900;font-size:13px;letter-spacing:.1em;color:var(--gold-hi);text-transform:uppercase;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center}
.bounty-admin .btype-row{margin-bottom:10px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.bounty-admin .btype-row:last-child{border-bottom:none;margin-bottom:0;padding-bottom:0}
.bounty-admin .btype-label{font-family:'Cinzel',serif;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
.bounty-admin .bdesc{font-size:14px;color:var(--parch);margin:4px 0 8px}
.bounty-admin .claim-form{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.bounty-admin .claim-form select{width:auto;flex:1;min-width:110px}
.bounty-admin .existing{margin-top:8px;font-size:13px;color:var(--gold-hi)}

.hint{font-size:13px;color:#5c5648;margin-top:6px;line-height:1.4}
footer{margin-top:44px;text-align:center}
footer .mark{font-family:'Cinzel',serif;font-weight:900;font-size:15px;letter-spacing:.4em;text-indent:.4em;color:var(--gold)}
@media (max-width:600px){ .grid2,.grid3{grid-template-columns:1fr} }
</style>
</head>
<body>
<div class="wrap">

  <header class="mast">
    <div class="clan">MILLIONS</div>
    <div class="ev">Boss Hunt — Admin</div>
  </header>
  <div class="mastrule"></div>
  <nav class="top"><a href="/boss-hunt-2026">← Public Board</a><a href="/boss-hunt-review-2026">Review Submissions</a><a href="/boss-hunt-settings-2026">Settings (KPH &amp; Adjustments)</a></nav>

  <!-- ── Sign in ───────────────────────────────────────────── -->
  <section id="gate">
    <h2 class="sec">Sign In</h2>
    <div class="sec-rule"></div>
    <div class="card">
      <div class="field">
        <label for="pw">Admin password</label>
        <input type="password" id="pw" autocomplete="current-password">
      </div>
      <button id="signin">Sign In</button>
      <div id="gateMsg"></div>
    </div>
  </section>

  <!-- ── Main panel ────────────────────────────────────────── -->
  <section id="panel" hidden>

    <h2 class="sec">Log a Drop</h2>
    <div class="sec-rule"></div>
    <div class="card">
      <div class="grid2">
        <div class="field">
          <label for="dropBoss">Boss</label>
          <select id="dropBoss"></select>
        </div>
        <div class="field">
          <label for="dropItem">Item</label>
          <select id="dropItem"></select>
        </div>
      </div>
      <div class="grid2">
        <div class="field">
          <label for="dropTeam">Team</label>
          <select id="dropTeam"></select>
        </div>
        <div class="field">
          <label for="dropRsn">Player (RSN)</label>
          <input type="text" id="dropRsn" autocomplete="off" placeholder="Zezima">
        </div>
      </div>
      <div class="field">
        <label class="chk"><input type="checkbox" id="dropClog"> Counts toward a collection log slot (+20% points)</label>
      </div>
      <button id="dropSubmit">Log Drop</button>
      <div id="dropMsg"></div>
    </div>

    <h2 class="sec">Recent Drops</h2>
    <div class="sec-rule"></div>
    <div class="card" id="recentDropsCard"><div class="empty">Loading…</div></div>

    <h2 class="sec">Bounties</h2>
    <div class="sec-rule"></div>
    <div id="bountyAdminList"></div>

    <h2 class="sec">Prize Pool</h2>
    <div class="sec-rule"></div>
    <div class="card">
      <div class="field">
        <label for="prizePoolInput">Current prize pool (GP)</label>
        <input type="number" id="prizePoolInput" min="0">
      </div>
      <button id="prizePoolSave">Save</button>
      <div id="prizePoolMsg"></div>
    </div>

    <h2 class="sec">Audit Log</h2>
    <div class="sec-rule"></div>
    <div class="card" id="auditLogCard"><div class="empty">Loading…</div></div>

    <button class="ghost" id="signout" style="margin-top:8px">Sign out</button>
  </section>

  <footer>
    <div class="mark">MILLIONS</div>
  </footer>
</div>

<script>
const TEAMS = ["Team A", "Team B", "Team C"];

const $ = id => document.getElementById(id);
let pw = sessionStorage.getItem('bh_pw') || '';

let CONFIG = null;
let BOUNTIES = null;
async function loadSharedData(){
  const [c, b] = await Promise.all([
    fetch('/boss-hunt-config-2026.json').then(r => r.json()),
    fetch('/boss-hunt-bounties-2026.json').then(r => r.json()),
  ]);
  CONFIG = c;
  BOUNTIES = b;
}

function say(el, text, ok){ el.innerHTML = `<div class="msg ${ok?'ok':'err'}">${text}</div>`; }
function esc(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmtGP(n){
  n = Number(n)||0;
  if (n >= 1e9) return (n/1e9).toFixed(2).replace(/\.?0+$/,'') + 'B';
  if (n >= 1e6) return (n/1e6).toFixed(1).replace(/\.?0+$/,'') + 'M';
  if (n >= 1e3) return (n/1e3).toFixed(0) + 'K';
  return Math.round(n).toLocaleString();
}

async function api(path, opts={}){
  const headers = Object.assign({'Authorization': 'Bearer ' + pw}, opts.headers||{});
  const r = await fetch(path, Object.assign({}, opts, {headers}));
  if (r.status === 401){ sessionStorage.removeItem('bh_pw'); location.reload(); throw new Error('Unauthorized'); }
  return r;
}

// ── Auth ──────────────────────────────────────────────────
async function tryAuth(candidate){
  const r = await fetch('/api/admin/probe', {
    method: 'POST',
    headers: {'Content-Type':'application/json', 'Authorization':'Bearer ' + candidate},
    body: '{}',
  });
  return r.status !== 401;
}

async function unlock(){
  $('gate').hidden = true;
  $('panel').hidden = false;
  await loadSharedData();
  populateDropForm();
  renderBountyAdmin();
  await Promise.all([loadState(), loadAuditLog()]);
}

$('signin').onclick = async () => {
  const cand = $('pw').value.trim();
  if (!cand) return say($('gateMsg'), 'Enter the password.', false);
  $('signin').disabled = true;
  try{
    if (await tryAuth(cand)){
      pw = cand;
      sessionStorage.setItem('bh_pw', pw);
      unlock();
    } else {
      say($('gateMsg'), 'Wrong password.', false);
    }
  } catch(e){
    say($('gateMsg'), 'Could not reach the server.', false);
  }
  $('signin').disabled = false;
};
$('pw').addEventListener('keydown', e => { if (e.key === 'Enter') $('signin').click(); });
$('signout').onclick = () => { sessionStorage.removeItem('bh_pw'); location.reload(); };

// ── Drop logging form ────────────────────────────────────
function populateDropForm(){
  TEAMS.forEach(t => $('dropTeam').add(new Option(t, t)));

  const TYPE_ORDER = ['Slayer','God Wars','Desert Treasure','General','Dagannoth','Wilderness','Raids','Skilling'];
  const byType = {};
  CONFIG.bosses.forEach(b => { const t = b.bossType || 'Wilderness'; (byType[t] = byType[t] || []).push(b); });
  if (byType['General']) byType['General'].sort((a, b) => a.boss.localeCompare(b.boss));
  TYPE_ORDER.filter(t => byType[t] && byType[t].length).forEach(type => {
    const group = document.createElement('optgroup');
    group.label = type;
    byType[type].forEach(b => group.appendChild(new Option(b.boss, b.boss)));
    $('dropBoss').appendChild(group);
  });

  fillItemsForBoss();
  $('dropBoss').addEventListener('change', fillItemsForBoss);
}
function fillItemsForBoss(){
  const boss = CONFIG.bosses.find(b => b.boss === $('dropBoss').value) || CONFIG.bosses[0];
  $('dropItem').innerHTML = '';
  boss.displayItems.filter(d => d.kind === 'item').forEach(it => {
    $('dropItem').add(new Option(it.name, it.name));
  });
}

$('dropSubmit').onclick = async () => {
  const boss = $('dropBoss').value;
  const item = $('dropItem').value;
  const team = $('dropTeam').value;
  const rsn = $('dropRsn').value.trim();
  const isCollectionLog = $('dropClog').checked;

  $('dropSubmit').disabled = true;
  try{
    const r = await api('/api/admin/drop', {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ boss, item, team, rsn, quantity: 1, isCollectionLog }),
    });
    if (!r.ok) throw new Error((await r.json()).error || 'Failed');
    say($('dropMsg'), `Logged: ${rsn ? rsn + ' — ' : ''}${item} (${boss}, ${team})`, true);
    $('dropRsn').value = '';
    $('dropClog').checked = false;
    await Promise.all([loadState(), loadAuditLog()]);
  } catch(e){
    say($('dropMsg'), 'Failed: ' + e.message, false);
  }
  $('dropSubmit').disabled = false;
};

// ── Load public state (recent drops, prize pool) ─────────
let STATE = { kph: {}, prizePool: 0, drops: [], bountyCompletions: [], bountyReveals: [] };

async function loadState(){
  const r = await fetch('/api/state', { cache: 'no-store' });
  STATE = await r.json();
  renderRecentDrops();
  renderBountyAdmin();
  $('prizePoolInput').value = STATE.prizePool || 0;
}

function ago(ts){
  const s = Math.floor((Date.now()-ts)/1000);
  if (s<60) return s+'s ago';
  if (s<3600) return Math.floor(s/60)+'m ago';
  if (s<86400) return Math.floor(s/3600)+'h ago';
  return Math.floor(s/86400)+'d ago';
}

function renderRecentDrops(){
  const recent = [...STATE.drops].sort((a,b)=>b.loggedAt-a.loggedAt).slice(0,30);
  if (!recent.length){ $('recentDropsCard').innerHTML = '<div class="empty">Nothing logged yet.</div>'; return; }
  $('recentDropsCard').innerHTML = '<table class="list"><thead><tr><th>When</th><th>Team</th><th>Player</th><th>Drop</th><th>Boss</th><th></th></tr></thead><tbody>' +
    recent.map(d => `<tr>
      <td>${ago(d.loggedAt)}</td>
      <td>${esc(d.team)}</td>
      <td>${d.rsn ? esc(d.rsn) : '—'}</td>
      <td>${esc(d.item)}${d.isCollectionLog ? ' <span style="color:var(--gold-hi);font-size:12px">(CLog)</span>' : ''}</td>
      <td>${esc(d.boss)}</td>
      <td style="text-align:right"><button class="ghost small" data-undo-drop="${d.id}">Undo</button></td>
    </tr>`).join('') + '</tbody></table>';

  $('recentDropsCard').querySelectorAll('[data-undo-drop]').forEach(btn => {
    btn.onclick = async () => {
      if (!confirm('Undo this drop? This cannot be un-undone.')) return;
      const r = await api(`/api/admin/drop/${btn.dataset.undoDrop}/undo`, {method:'POST'});
      if (r.ok){ await Promise.all([loadState(), loadAuditLog()]); } else alert('Undo failed.');
    };
  });
}

// ── Prize pool ────────────────────────────────────────────
$('prizePoolSave').onclick = async () => {
  const amount = parseFloat($('prizePoolInput').value);
  if (!Number.isFinite(amount) || amount < 0) return say($('prizePoolMsg'), 'Enter a valid amount.', false);
  $('prizePoolSave').disabled = true;
  try{
    const r = await api('/api/admin/prize-pool', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ amount }),
    });
    if (!r.ok) throw new Error((await r.json()).error || 'Failed');
    say($('prizePoolMsg'), `Prize pool set to ${fmtGP(amount)} GP.`, true);
    await loadAuditLog();
  } catch(e){
    say($('prizePoolMsg'), 'Failed: ' + e.message, false);
  }
  $('prizePoolSave').disabled = false;
};

// ── Bounty admin ──────────────────────────────────────────
function renderBountyAdmin(){
  const numbers = [...new Set(BOUNTIES.map(b=>b.number))].sort((a,b)=>a-b);
  $('bountyAdminList').innerHTML = numbers.map(num => {
    const pair = BOUNTIES.filter(b=>b.number===num);
    // Combined reveal state: "revealed" if either half is already revealed (so the
    // checkbox reflects reality even if they were ever set separately in the past).
    const anyRevealed = pair.some(b => {
      const reveal = STATE.bountyReveals.find(r=>r.bountyNumber===b.number && r.bountyType===b.type);
      return reveal && reveal.revealed;
    });

    const rows = pair.map(b => {
      const completions = STATE.bountyCompletions.filter(c=>c.bountyNumber===b.number && c.bountyType===b.type);
      const existingHtml = completions.map(c =>
        `<div class="existing">${esc(c.team)} — ${esc(c.placement)} <button class="ghost small" data-undo-bounty="${c.id}" style="margin-left:8px">Undo</button></div>`
      ).join('');
      return `<div class="btype-row">
        <div class="btype-label">${b.type}</div>
        <div class="bdesc">${esc(b.description)}</div>
        <div class="claim-form">
          <select data-claim-team-${b.number}-${b.type}>
            ${TEAMS.map(t=>`<option value="${t}">${t}</option>`).join('')}
          </select>
          <select data-claim-place-${b.number}-${b.type}>
            <option>1st Place</option><option>2nd Place</option><option>3rd Place</option>
          </select>
          <button class="small" data-mark-bounty="${b.number}" data-mark-type="${b.type}">Mark Complete</button>
        </div>
        ${existingHtml}
      </div>`;
    }).join('');
    return `<div class="bounty-admin">
      <div class="bnum">
        <span>Bounty #${num}</span>
        <label class="chk" style="margin:0">
          <input type="checkbox" data-reveal-toggle data-bounty-num="${num}" ${anyRevealed?'checked':''}>
          Revealed to public
        </label>
      </div>
      ${rows}
    </div>`;
  }).join('');

  $('bountyAdminList').querySelectorAll('[data-reveal-toggle]').forEach(cb => {
    cb.onchange = async () => {
      const num = Number(cb.dataset.bountyNum);
      cb.disabled = true;
      try{
        // One checkbox controls both Major and Minor for this bounty number
        await Promise.all(['Major','Minor'].map(type => api('/api/admin/bounty-reveal', {
          method:'POST', headers:{'Content-Type':'application/json'},
          body: JSON.stringify({ bountyNumber: num, bountyType: type, revealed: cb.checked }),
        })));
        await Promise.all([loadState(), loadAuditLog()]);
      } catch(e){
        alert('Failed to update reveal status.');
        cb.checked = !cb.checked;
      }
      cb.disabled = false;
    };
  });

  $('bountyAdminList').querySelectorAll('[data-mark-bounty]').forEach(btn => {
    btn.onclick = async () => {
      const num = Number(btn.dataset.markBounty);
      const type = btn.dataset.markType;
      const teamSel = document.querySelector(`[data-claim-team-${num}-${type}]`);
      const placeSel = document.querySelector(`[data-claim-place-${num}-${type}]`);
      btn.disabled = true;
      try{
        const r = await api('/api/admin/bounty', {
          method:'POST', headers:{'Content-Type':'application/json'},
          body: JSON.stringify({ bountyNumber: num, bountyType: type, team: teamSel.value, placement: placeSel.value }),
        });
        if (!r.ok) throw new Error((await r.json()).error || 'Failed');
        await Promise.all([loadState(), loadAuditLog()]);
      } catch(e){ alert('Failed: ' + e.message); }
      btn.disabled = false;
    };
  });

  $('bountyAdminList').querySelectorAll('[data-undo-bounty]').forEach(btn => {
    btn.onclick = async () => {
      if (!confirm('Undo this bounty completion?')) return;
      const r = await api(`/api/admin/bounty/${btn.dataset.undoBounty}/undo`, {method:'POST'});
      if (r.ok) await Promise.all([loadState(), loadAuditLog()]); else alert('Undo failed.');
    };
  });
}

// ── Audit log ─────────────────────────────────────────────
async function loadAuditLog(){
  try{
    const r = await api('/api/admin/audit-log');
    const { entries } = await r.json();
    if (!entries.length){ $('auditLogCard').innerHTML = '<div class="empty">No activity yet.</div>'; return; }
    $('auditLogCard').innerHTML = '<table class="list"><tbody>' +
      entries.slice(0,60).map(e => `<tr><td style="width:90px;color:#6b6558">${ago(e.logged_at)}</td><td>${esc(e.details)}</td></tr>`).join('') +
      '</tbody></table>';
  } catch(e){
    $('auditLogCard').innerHTML = '<div class="empty">Could not load audit log.</div>';
  }
}

// Resume an existing session
if (pw) tryAuth(pw).then(ok => ok ? unlock() : sessionStorage.removeItem('bh_pw'));
</script>
</body>
</html>
