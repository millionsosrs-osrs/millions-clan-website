<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Millions — Boss Hunt · Submit a Drop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;900&family=Barlow+Condensed:wght@400;600&family=IM+Fell+English:ital@1&display=swap" rel="stylesheet">
<style>
:root{
  --void:#06070a; --ink:#0b0d12; --panel:#11141a;
  --gold:#c9a227; --gold-hi:#eed595; --gold-lo:#5c4810;
  --parch:#c4bca8; --dim:#7a7365; --line:#201c14;
  --good:#4caf50; --bad:#a63f2c;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:radial-gradient(100% 30% at 50% 0%, rgba(201,162,39,.08), rgba(201,162,39,0) 60%),
    linear-gradient(#080a0e, var(--void) 45%, #040507 100%);
  background-repeat:no-repeat;
  color:var(--parch); font-family:'Barlow Condensed',system-ui,sans-serif;
  -webkit-font-smoothing:antialiased; min-height:100vh;
}
.wrap{max-width:640px;margin:0 auto;padding:0 24px 64px}
.mast{padding:32px 0 0;text-align:center}
.mast .clan{font-family:'Cinzel',serif;font-weight:900;font-size:15px;letter-spacing:.4em;text-indent:.4em;color:var(--gold)}
.mast .ev{font-family:'Cinzel',serif;font-weight:900;font-size:26px;line-height:1;margin-top:8px;text-transform:uppercase;letter-spacing:.05em;
  background:linear-gradient(178deg,#fdf2d6 6%,var(--gold-hi) 40%,var(--gold) 64%,#7d6214 98%);-webkit-background-clip:text;background-clip:text;color:transparent}
.mastrule{margin-top:16px;height:1px;background:linear-gradient(90deg,transparent,var(--gold-lo) 12%,var(--gold) 50%,var(--gold-lo) 88%,transparent)}
nav.top{display:flex;justify-content:center;margin-top:10px}
nav.top a{font-family:'Cinzel',serif;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);text-decoration:none}
nav.top a:hover{color:var(--gold-hi)}

.card{background:linear-gradient(#11141a,#0a0c10);border:1px solid #1f1b13;border-top:1px solid #302719;padding:26px 24px;margin-top:26px}
label{display:block;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#6b6558;margin-bottom:6px;font-weight:600}
input,select,button{font-family:'Barlow Condensed',system-ui,sans-serif;font-size:17px}
input,select{width:100%;background:#0a0c10;border:1px solid #2a2418;color:#e2d8bd;padding:11px 12px;outline:none}
input:focus,select:focus{border-color:var(--gold)}
.field{margin-bottom:18px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
button{background:linear-gradient(#1a1610,#0f0d09);border:1px solid var(--gold-lo);color:var(--gold-hi);
  padding:13px 26px;letter-spacing:.18em;text-transform:uppercase;font-weight:600;cursor:pointer;font-family:'Cinzel',serif;width:100%}
button:hover{border-color:var(--gold);color:#fff6d8}
button:disabled{opacity:.45;cursor:not-allowed}
label.chk{display:flex;align-items:center;gap:8px;font-size:15px;letter-spacing:.02em;text-transform:none;color:var(--parch);cursor:pointer}
label.chk input{width:auto}

.file-drop{border:2px dashed #2a2418;padding:20px;text-align:center;cursor:pointer;color:var(--dim);font-size:15px}
.file-drop:hover{border-color:var(--gold-lo)}
.file-drop.has-file{border-color:var(--good);color:var(--good)}
.preview{max-width:100%;max-height:280px;margin-top:12px;display:none;border:1px solid var(--line)}

.msg{margin-top:16px;padding:11px 14px;font-size:16px;border-left:2px solid}
.msg.ok{border-color:var(--good);color:#8fbf92;background:rgba(76,175,80,.07)}
.msg.err{border-color:var(--bad);color:#c0705f;background:rgba(166,63,44,.08)}
.hint{font-size:14px;color:#5c5648;margin-top:7px;line-height:1.45}

footer{margin-top:44px;text-align:center}
footer .mark{font-family:'Cinzel',serif;font-weight:900;font-size:15px;letter-spacing:.4em;text-indent:.4em;color:var(--gold)}
@media (max-width:500px){ .grid2{grid-template-columns:1fr} }
</style>
</head>
<body>
<div class="wrap">

  <header class="mast">
    <div class="clan">MILLIONS</div>
    <div class="ev">Boss Hunt</div>
  </header>
  <div class="mastrule"></div>
  <nav class="top"><a href="/boss-hunt-2026">← Back to Scoreboard</a></nav>

  <div class="card">
    <div class="field">
      <label for="rsn">Your RSN</label>
      <input type="text" id="rsn" autocomplete="off" placeholder="Zezima">
    </div>

    <div class="grid2">
      <div class="field">
        <label for="team">Team</label>
        <select id="team"></select>
      </div>
      <div class="field">
        <label for="boss">Boss</label>
        <select id="boss"></select>
      </div>
    </div>

    <div class="field">
      <label for="item">Item</label>
      <select id="item"></select>
    </div>

    <div class="field">
      <label class="chk"><input type="checkbox" id="clog"> This completed a collection log slot</label>
    </div>

    <div class="field">
      <label for="fileInput">Evidence screenshot</label>
      <div class="file-drop" id="fileDrop">Click to choose an image, or drag one here</div>
      <input type="file" id="fileInput" accept="image/*" style="display:none">
      <img class="preview" id="preview" alt="">
      <div class="hint">A drop-log or chat screenshot showing the item and your name. Max 8MB.</div>
    </div>

    <button id="submitBtn">Submit for Review</button>
    <div id="msg"></div>
  </div>

  <footer>
    <div class="mark">MILLIONS</div>
    <div class="note" style="margin-top:9px;font-size:12px;letter-spacing:.14em;color:#4f4a3d;text-transform:uppercase">Submissions are reviewed by an admin before they count</div>
  </footer>
</div>

<script>
const TEAMS = ["Team A", "Team B", "Team C"];
const $ = id => document.getElementById(id);

function say(el, text, ok){ el.innerHTML = `<div class="msg ${ok?'ok':'err'}">${text}</div>`; }

let CONFIG = null;

function fillItems(){
  const boss = CONFIG.bosses.find(b => b.boss === $('boss').value) || CONFIG.bosses[0];
  $('item').innerHTML = '';
  boss.displayItems.filter(d => d.kind === 'item').forEach(it => $('item').add(new Option(it.name, it.name)));
}

async function init(){
  CONFIG = await (await fetch('/boss-hunt-config-2026.json')).json();

  TEAMS.forEach(t => $('team').add(new Option(t, t)));

  const TYPE_ORDER = ['Slayer','God Wars','Desert Treasure','General','Dagannoth','Wilderness','Raids','Skilling'];
  const byType = {};
  CONFIG.bosses.forEach(b => { const t = b.bossType || 'Wilderness'; (byType[t] = byType[t] || []).push(b); });
  if (byType['General']) byType['General'].sort((a,b) => a.boss.localeCompare(b.boss));
  TYPE_ORDER.filter(t => byType[t] && byType[t].length).forEach(type => {
    const group = document.createElement('optgroup');
    group.label = type;
    byType[type].forEach(b => group.appendChild(new Option(b.boss, b.boss)));
    $('boss').appendChild(group);
  });

  fillItems();
  $('boss').addEventListener('change', fillItems);
}
init();

// ── File selection / preview ──────────────────────────────
let selectedFile = null;
$('fileDrop').addEventListener('click', () => $('fileInput').click());
$('fileInput').addEventListener('change', () => {
  const f = $('fileInput').files[0];
  if (!f) return;
  selectedFile = f;
  $('fileDrop').textContent = f.name;
  $('fileDrop').classList.add('has-file');
  const reader = new FileReader();
  reader.onload = e => { $('preview').src = e.target.result; $('preview').style.display = 'block'; };
  reader.readAsDataURL(f);
});
['dragover','drop'].forEach(evt => $('fileDrop').addEventListener(evt, e => e.preventDefault()));
$('fileDrop').addEventListener('drop', e => {
  const f = e.dataTransfer.files[0];
  if (f) { $('fileInput').files = e.dataTransfer.files; $('fileInput').dispatchEvent(new Event('change')); }
});

// ── Submit ─────────────────────────────────────────────────
$('submitBtn').onclick = async () => {
  const rsn = $('rsn').value.trim();
  const team = $('team').value;
  const boss = $('boss').value;
  const item = $('item').value;
  const isCollectionLog = $('clog').checked;

  if (!rsn) return say($('msg'), 'Enter your RSN.', false);
  if (!selectedFile) return say($('msg'), 'Please attach a screenshot.', false);
  if (selectedFile.size > 8*1024*1024) return say($('msg'), 'Image is too large (max 8MB).', false);

  $('submitBtn').disabled = true;
  try{
    const form = new FormData();
    form.append('rsn', rsn);
    form.append('team', team);
    form.append('boss', boss);
    form.append('item', item);
    form.append('quantity', '1');
    form.append('isCollectionLog', isCollectionLog ? 'true' : 'false');
    form.append('image', selectedFile);

    const r = await fetch('/api/submit-drop', { method: 'POST', body: form });
    if (!r.ok) throw new Error((await r.json()).error || 'Failed');

    say($('msg'), `Submitted! An admin will review "${item}" (${boss}) shortly.`, true);
    $('rsn').value = '';
    $('clog').checked = false;
    selectedFile = null;
    $('fileInput').value = '';
    $('fileDrop').textContent = 'Click to choose an image, or drag one here';
    $('fileDrop').classList.remove('has-file');
    $('preview').style.display = 'none';
  } catch(e){
    say($('msg'), 'Failed: ' + e.message, false);
  }
  $('submitBtn').disabled = false;
};
</script>
</body>
</html>
