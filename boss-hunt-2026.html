<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Millions — Boss Hunt · Live Scoreboard</title>
<meta name="description" content="Live scoreboard for the Millions clan Boss Hunt event.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;900&family=Barlow+Condensed:wght@400;600&family=IM+Fell+English:ital@1&display=swap" rel="stylesheet">
<style>
:root{
  --void:#06070a; --ink:#0b0d12; --panel:#11141a;
  --gold:#c9a227; --gold-hi:#eed595; --gold-lo:#5c4810;
  --parch:#c4bca8; --dim:#7a7365; --line:#201c14;
  --team-1:#c9a227; --team-2:#7190b6; --team-3:#a63f2c;
  --good:#4caf50; --bad:#a63f2c;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:radial-gradient(100% 30% at 50% 0%, rgba(201,162,39,.08), rgba(201,162,39,0) 60%),
    linear-gradient(#080a0e, var(--void) 45%, #040507 100%);
  background-repeat:no-repeat;
  color:var(--parch); font-family:'Barlow Condensed',system-ui,sans-serif;
  -webkit-font-smoothing:antialiased; min-height:100vh;
}
.wrap{max-width:1080px;margin:0 auto;padding:0 24px 64px}
.mast{padding:38px 0 0;text-align:center}
.mast .clan{font-family:'Cinzel',serif;font-weight:900;font-size:15px;letter-spacing:.4em;text-indent:.4em;color:var(--gold)}
.mast .ev{font-family:'Cinzel',serif;font-weight:900;font-size:30px;line-height:1;margin-top:8px;text-transform:uppercase;letter-spacing:.05em;
  background:linear-gradient(178deg,#fdf2d6 6%,var(--gold-hi) 40%,var(--gold) 64%,#7d6214 98%);-webkit-background-clip:text;background-clip:text;color:transparent}
.mast .sub{margin-top:6px;font-size:14px;color:var(--dim);letter-spacing:.1em}
.mastrule{margin-top:16px;height:1px;background:linear-gradient(90deg,transparent,var(--gold-lo) 12%,var(--gold) 50%,var(--gold-lo) 88%,transparent)}
.live{display:flex;justify-content:center;align-items:center;gap:8px;font-size:13px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);margin-top:14px}
.top-nav{text-align:center;margin-top:10px}
.top-nav a{font-family:'Cinzel',serif;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold-lo);text-decoration:none;border-bottom:1px solid var(--gold-lo)}
.top-nav a:hover{color:var(--gold-hi);border-color:var(--gold-hi)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--good);animation:pulse 2.4s ease-in-out infinite}
.dot.stale{background:var(--bad);animation:none}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}

h2.sec{font-family:'Cinzel',serif;font-weight:900;font-size:22px;text-transform:uppercase;letter-spacing:.13em;color:#ddd1b1;margin:40px 0 4px}
.sec-rule{height:1px;background:linear-gradient(90deg,var(--gold),rgba(0,0,0,0) 55%);margin-bottom:22px}

.prizepool{text-align:center;margin-top:20px;font-family:'Cinzel',serif}
.prizepool .amt{font-size:26px;font-weight:900;color:var(--gold-hi)}
.prizepool .lbl{font-size:12px;letter-spacing:.2em;color:var(--dim);text-transform:uppercase;margin-top:2px}

.team{margin-bottom:22px}
.team .top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:7px}
.team .nm{font-family:'Cinzel',serif;font-weight:900;font-size:21px;letter-spacing:.06em;color:var(--tc)}
.team .rank{font-size:13px;letter-spacing:.2em;color:#514c40;text-transform:uppercase;margin-left:10px}
.team .val{font-family:'Cinzel',serif;font-weight:900;font-size:24px;color:#e2d8bd}
.team .val span{font-size:14px;color:var(--dim);letter-spacing:.14em;margin-left:8px}
.team .sub-stats{font-size:13px;color:var(--dim);margin-top:4px;letter-spacing:.04em}
.track{position:relative;height:26px;background:#0d1015;border:1px solid var(--line);overflow:hidden;margin-top:6px}
.fill{position:absolute;inset:0 auto 0 0;width:0;background:linear-gradient(90deg,var(--tc),color-mix(in srgb,var(--tc) 55%, #000));transition:width 900ms cubic-bezier(.22,.8,.3,1)}
.fill::after{content:'';position:absolute;top:0;right:0;bottom:0;width:2px;background:#fff;opacity:.5}

.bounty-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.bounty-card{background:linear-gradient(#12151b,#0a0c10);border:1px solid var(--line);border-top:2px solid var(--gold-lo);padding:14px 16px}
.bounty-card.hidden-b{opacity:.5}
.bounty-card .btitle{font-family:'Cinzel',serif;font-weight:600;font-size:13px;letter-spacing:.06em;color:var(--gold-hi);text-transform:uppercase}
.bounty-card .bdesc{font-size:14px;color:var(--parch);margin-top:5px;line-height:1.4}
.bounty-card .bstatus{margin-top:9px;font-size:13px;color:var(--dim);display:flex;flex-direction:column;gap:2px}
.bounty-card .bstatus .claimed{color:var(--gold-hi)}
.badge-hidden{display:inline-block;font-family:'Cinzel',serif;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#514c40;border:1px solid var(--line);padding:2px 8px;margin-top:8px}

.boss-card{background:linear-gradient(#11141a,#0a0c10);border:1px solid #1f1b13;border-top:1px solid #302719;margin-bottom:10px}
.boss-head{display:flex;justify-content:space-between;align-items:center;padding:13px 18px;gap:10px}
.boss-head .bimg{width:64px;height:64px;object-fit:contain;image-rendering:pixelated;order:2}
.boss-head .bname{font-family:'Cinzel',serif;font-weight:600;font-size:21px;letter-spacing:.05em;color:#ddd1b1;order:1}
.boss-body{padding:0 18px 16px}
.item-img{width:28px;height:28px;object-fit:contain;vertical-align:middle;margin-right:8px;image-rendering:pixelated}
.item-name-cell{display:flex;align-items:center}
.clog-mark{color:var(--gold-hi);font-size:11px;margin-left:5px}

.jump-nav{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;position:sticky;top:0;z-index:20;
  background:linear-gradient(#0d0f13ee, #0d0f13ee);padding:10px 0;margin-top:-10px}
.tab-btn{font-family:'Cinzel',serif;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--gold-lo);
  background:var(--panel);cursor:pointer;border:1px solid var(--gold-lo);padding:7px 14px;border-radius:3px}
.tab-btn:hover{color:var(--gold-hi);border-color:var(--gold-hi)}
.tab-btn.active{color:#0d0f13;background:var(--gold);border-color:var(--gold);font-weight:700}

.type-section{margin-bottom:34px}

table.items{width:100%;border-collapse:collapse;font-size:15px;margin-top:8px}
table.items th{font-family:'Cinzel',serif;font-weight:600;font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:#a89f8c;text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
table.items td{padding:6px 8px;border-bottom:1px solid #14110c;color:#cbc1a8}
table.items td.num{text-align:center;font-family:'Cinzel',serif}

.bonus-row{margin-top:10px;padding:8px 10px;background:rgba(201,162,39,.05);border-left:2px solid var(--gold-lo);font-size:15px}
.bonus-row .achieved{color:var(--good)}
.bonus-row .pending{color:var(--dim)}

.meta-card{background:linear-gradient(#12151b,#0a0c10);border:1px solid var(--line);border-top:2px solid #5a1a7a;padding:14px 16px;margin-bottom:10px}
.meta-card .mtitle{font-family:'Cinzel',serif;font-weight:600;font-size:14px;color:#b060e0}
.meta-card .mstatus{margin-top:6px;font-size:13px;color:var(--dim)}
.meta-card .mstatus .achieved{color:var(--good)}

footer{margin-top:50px;text-align:center}
footer .mark{font-family:'Cinzel',serif;font-weight:900;font-size:16px;letter-spacing:.42em;text-indent:.42em;color:var(--gold)}
footer .note{margin-top:9px;font-size:12px;letter-spacing:.14em;color:#4f4a3d;text-transform:uppercase}

@media (max-width:640px){
  .team .val{font-size:20px}
}
</style>
</head>
<body>
<div class="wrap">

  <header class="mast">
    <div class="clan">MILLIONS</div>
    <div class="ev">Boss Hunt</div>
    <div class="sub">Live Scoreboard</div>
  </header>
  <div class="mastrule"></div>
  <div class="live"><span class="dot" id="dot"></span><span id="liveTxt">Live</span></div>
  <nav class="top-nav"><a href="/boss-hunt-activity-2026">Bounties &amp; Recent Drops →</a> &nbsp;·&nbsp; <a href="/boss-hunt-submit-2026">Submit a Drop →</a></nav>

  <div class="prizepool">
    <div class="amt" id="prizePoolAmt">—</div>
    <div class="lbl">Current Prize Pool</div>
  </div>

  <h2 class="sec">Standings</h2>
  <div class="sec-rule"></div>
  <div id="standings"></div>

  <h2 class="sec">Boss Breakdown</h2>
  <div class="sec-rule"></div>
  <div class="jump-nav" id="jumpNav"></div>
  <div id="bossList"></div>

  <footer>
    <div class="mark">MILLIONS</div>
    <div class="note">Updates automatically</div>
  </footer>
</div>

<script>
const TEAMS = ["Team A", "Team B", "Team C"];
const TEAM_COLORS = { "Team A": "var(--team-1)", "Team B": "var(--team-2)", "Team C": "var(--team-3)" };

let CONFIG = null;
let BOUNTIES = null;
async function loadSharedData(){
  const [c, b] = await Promise.all([
    fetch('/boss-hunt-config-2026.json').then(r => r.json()),
    fetch('/boss-hunt-bounties-2026.json').then(r => r.json()),
  ]);
  CONFIG = c;
  BOUNTIES = b;
}
let BOSS_MAP = {};
let activeType = null;
const $ = id => document.getElementById(id);
const fmtNum = n => Math.round(n).toLocaleString();
const fmtGP = n => {
  if (n >= 1e9) return (n/1e9).toFixed(2).replace(/\.?0+$/,'') + 'B';
  if (n >= 1e6) return (n/1e6).toFixed(1).replace(/\.?0+$/,'') + 'M';
  if (n >= 1e3) return (n/1e3).toFixed(0) + 'K';
  return Math.round(n).toLocaleString();
};
function findItem(bossName, itemName) {
  const b = BOSS_MAP[bossName];
  if (!b) return null;
  const di = b.displayItems.find(d => d.kind === 'item' && d.name === itemName);
  return di || null;
}

let STATE = { kph: {}, prizePool: 0, manualAdjustments: {}, drops: [], bountyCompletions: [], bountyReveals: [] };

function effectiveKPH(bossName) {
  if (STATE.kph[bossName] != null) return STATE.kph[bossName];
  const b = BOSS_MAP[bossName];
  return b ? b.actualKPH : null;
}

function effectiveManualAdjustment(bossName, item) {
  const key = bossName + '||' + item.name;
  if (STATE.manualAdjustments && STATE.manualAdjustments[key] != null) return STATE.manualAdjustments[key];
  return item.manualAdjustment;
}

function itemPointValue(bossName, item) {
  const kph = effectiveKPH(bossName);
  if (!kph || !item.dropRate) return null;
  const base = 1 / item.dropRate;
  return base * (CONFIG.assumptions.kphNormalizationConstant / kph) * effectiveManualAdjustment(bossName, item);
}

// ---- Per-team computation ----
function computeTeam(team) {
  const teamDrops = STATE.drops.filter(d => d.team === team);
  const obtained = new Set();          // "boss||item" keys, presence only
  let dropPoints = 0, geValue = 0, uniqueDropCount = 0, pendingKPH = false;

  for (const d of teamDrops) {
    const item = findItem(d.boss, d.item);
    if (!item) continue;
    obtained.add(d.boss + '||' + d.item);
    uniqueDropCount++;
    const pv = itemPointValue(d.boss, item);
    if (pv == null) { pendingKPH = true; }
    else {
      let val = pv * d.quantity;
      if (d.isCollectionLog) val += pv * d.quantity * CONFIG.assumptions.collectionLogBonus;
      dropPoints += val;
    }
    if (item.geValue) geValue += item.geValue * d.quantity;
  }

  // Per-boss bonuses (all_uniques / sub_group), now sourced from displayItems
  let bonusPoints = 0;
  const bonusStatus = []; // for display
  for (const b of CONFIG.bosses) {
    for (const di of b.displayItems) {
      if (di.kind !== 'all_uniques' && di.kind !== 'sub_group') continue;
      const bonusName = di.kind === 'all_uniques' ? 'All Uniques Bonus' : di.name;
      const achieved = di.memberItems.every(name => obtained.has(b.boss + '||' + name));
      let value = null;
      if (achieved) {
        value = 0;
        for (const name of di.memberItems) {
          const it = findItem(b.boss, name);
          const pv = it ? itemPointValue(b.boss, it) : null;
          if (pv == null) { value = null; break; }
          value += pv;
        }
        if (value != null) { value *= CONFIG.assumptions.uniqueBonusMultiplier; bonusPoints += value; }
      }
      bonusStatus.push({ boss: b.boss, name: bonusName, achieved, value });
    }
  }

  // Cross-boss meta bonuses
  const metaStatus = [];
  for (const mb of CONFIG.metaBonuses) {
    let achieved, value = null;
    if (mb.mixAndMatch) {
      // group member items by name with trailing "(X)" suffix stripped
      const groups = {};
      for (const m of mb.memberItems) {
        const base = m.item.replace(/\s*\([^)]*\)\s*$/, '');
        (groups[base] = groups[base] || []).push(m);
      }
      let groupsAchieved = 0;
      const achievedMembers = [];
      for (const base in groups) {
        const hit = groups[base].find(m => obtained.has(m.boss + '||' + m.item));
        if (hit) { groupsAchieved++; achievedMembers.push(hit); }
      }
      achieved = groupsAchieved >= (mb.requiredCount || Object.keys(groups).length);
    } else {
      achieved = mb.memberItems.every(m => obtained.has(m.boss + '||' + m.item));
    }

    // Value: use valueItems if the config provides a specific set to sum
    // (needed for DT2's mix-and-match Virtus bonus, which values off a
    // fixed reference boss rather than whichever pieces were actually
    // obtained), otherwise sum all memberItems.
    const valueSource = mb.valueItems || mb.memberItems;
    if (achieved) {
      value = 0;
      for (const m of valueSource) {
        const it = findItem(m.boss, m.item);
        const pv = it ? itemPointValue(m.boss, it) : null;
        if (pv == null) { value = null; break; }
        value += pv;
      }
      if (value != null) { value *= CONFIG.assumptions.uniqueBonusMultiplier; bonusPoints += value; }
    }
    metaStatus.push({ id: mb.id, name: mb.name, achieved, value, hasValue: true });
  }

  // Bounty points
  let bountyPoints = 0;
  for (const bc of STATE.bountyCompletions) {
    if (bc.team !== team) continue;
    const table = CONFIG.assumptions.bountyPoints[bc.bountyType];
    if (table && table[bc.placement] != null) bountyPoints += table[bc.placement];
  }

  return {
    team, dropPoints, bonusPoints, bountyPoints,
    totalPoints: dropPoints + bonusPoints + bountyPoints,
    geValue, uniqueDropCount, pendingKPH, obtained, bonusStatus, metaStatus,
  };
}

function render() {
  const results = TEAMS.map(computeTeam);
  results.sort((a, b) => b.totalPoints - a.totalPoints);
  const maxPoints = Math.max(1, ...results.map(r => r.totalPoints));

  $('prizePoolAmt').textContent = fmtGP(STATE.prizePool || 0) + ' GP';

  // ---- Standings ----
  $('standings').innerHTML = results.map((r, i) => `
    <div class="team" style="--tc:${TEAM_COLORS[r.team]}">
      <div class="top">
        <div><span class="nm">${r.team}</span><span class="rank">${i===0?'Leading':'#' + (i+1)}</span></div>
        <div class="val">${fmtNum(r.totalPoints)}<span>PTS</span></div>
      </div>
      <div class="track"><div class="fill" style="width:${(r.totalPoints/maxPoints*100).toFixed(1)}%"></div></div>
      <div class="sub-stats">${fmtGP(r.geValue)} GP value · ${r.uniqueDropCount} drops logged
        ${r.pendingKPH ? ' · <span style="color:var(--bad)">some items pending KPH input</span>' : ''}</div>
    </div>
  `).join('');

  // ---- Boss breakdown, grouped by boss type, with cross-boss bonuses appended ----
  const TYPE_ORDER = ['Slayer','God Wars','Desert Treasure','General','Dagannoth','Wilderness','Raids','Skilling'];
  const META_BONUS_SECTION = {
    slayer_all_uniques: 'Slayer', gwd_all_uniques: 'God Wars',
    dt2_full_sra: 'Desert Treasure', dt2_full_virtus: 'Desert Treasure',
  };

  function renderBossCard(b) {
    const rowsHtml = b.displayItems.map(di => {
      if (di.kind === 'item') {
        const pv = itemPointValue(b.boss, di);
        const cells = TEAMS.map(team => {
          const matching = STATE.drops.filter(d => d.team === team && d.boss === b.boss && d.item === di.name);
          if (!matching.length) return `<td class="num">—</td>`;
          const total = matching.reduce((sum, d) => sum + d.quantity, 0);
          const anyClog = matching.some(d => d.isCollectionLog);
          const clog = anyClog ? '<span class="clog-mark" title="Collection log">📜</span>' : '';
          return `<td class="num">${total}${clog}</td>`;
        }).join('');
        return `<tr><td><div class="item-name-cell"><img class="item-img" src="${di.img}" onerror="this.style.display='none'" alt="">${di.name}</div></td><td class="num">${pv != null ? fmtNum(pv) : '—'}</td>${cells}</tr>`;
      }
      if (di.kind === 'all_uniques' || di.kind === 'sub_group') {
        const bonusName = di.kind === 'all_uniques' ? 'All Uniques Bonus' : di.name;
        const perTeam = TEAMS.map(team => {
          const r = results.find(x => x.team === team);
          const status = r.bonusStatus.find(s => s.boss === b.boss && s.name === bonusName);
          return status.achieved
            ? `<span class="achieved">${team} ✓${status.value != null ? ' +' + fmtNum(status.value) : ''}</span>`
            : `<span class="pending">${team}: —</span>`;
        }).join(' &nbsp; ');
        return `<tr><td colspan="${2+TEAMS.length}"><div class="bonus-row">${bonusName}: ${perTeam}</div></td></tr>`;
      }
      return '';
    }).join('');

    return `<div class="boss-card" data-boss="${b.boss}">
      <div class="boss-head">
        <img class="bimg" src="${b.img}" onerror="this.style.display='none'" alt="">
        <span class="bname">${b.boss}</span>
      </div>
      <div class="boss-body">
        <table class="items"><thead><tr><th>Item</th><th>Pts</th>${TEAMS.map(t=>`<th>${t}</th>`).join('')}</tr></thead>
        <tbody>${rowsHtml}</tbody></table>
      </div>
    </div>`;
  }

  function renderMetaCard(mb) {
    const lines = results.map(r => {
      const ms = r.metaStatus.find(m => m.id === mb.id);
      const cls = ms.achieved ? 'achieved' : 'pending';
      const valTxt = ms.achieved ? (ms.value != null ? `+${fmtNum(ms.value)} pts` : 'pending KPH') : '';
      return `<div class="${cls}">${r.team}: ${ms.achieved ? '✓ Complete' : 'In progress'} ${valTxt}</div>`;
    }).join('');
    return `<div class="meta-card"><div class="mtitle">${mb.name}</div><div class="mstatus">${lines}</div></div>`;
  }

  const bossesByType = {};
  CONFIG.bosses.forEach(b => { (bossesByType[b.bossType || 'Wilderness'] = bossesByType[b.bossType || 'Wilderness'] || []).push(b); });

  const activeTypes = TYPE_ORDER.filter(t => bossesByType[t]);
  if (!activeType || !activeTypes.includes(activeType)) activeType = activeTypes[0];

  $('jumpNav').innerHTML = activeTypes.map(t =>
    `<button class="tab-btn${t === activeType ? ' active' : ''}" data-tab="${slugify(t)}">${t}</button>`
  ).join('');
  $('jumpNav').querySelectorAll('[data-tab]').forEach(btn => {
    btn.onclick = () => { switchTab(activeTypes.find(t => slugify(t) === btn.dataset.tab)); };
  });

  const bosses = bossesByType[activeType] || [];
  const metaCards = CONFIG.metaBonuses.filter(mb => META_BONUS_SECTION[mb.id] === activeType).map(renderMetaCard).join('');
  $('bossList').innerHTML = `<div class="type-section">
    ${bosses.map(renderBossCard).join('')}
    ${metaCards}
  </div>`;
}

function switchTab(type){
  activeType = type;
  render();
}

function slugify(s){ return s.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, ''); }

// ---- Polling ----
const POLL_MS = 20000;
let lastStateJSON = null;

async function poll() {
  try {
    const r = await fetch('/api/state', { cache: 'no-store' });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const newState = await r.json();
    const newStateJSON = JSON.stringify(newState);

    // Skip the re-render entirely if nothing actually changed — this is
    // what was causing the page to "jump": every poll rebuilt the whole
    // DOM (all ~340 images re-requested), which shifts scroll position as
    // things load/fail at different times, even when no data changed.
    if (newStateJSON !== lastStateJSON) {
      const scrollY = window.scrollY;
      STATE = newState;
      lastStateJSON = newStateJSON;
      render();
      window.scrollTo(0, scrollY);
    }

    $('dot').classList.remove('stale');
    $('liveTxt').textContent = 'Live';
  } catch (e) {
    $('dot').classList.add('stale');
    $('liveTxt').textContent = 'Reconnecting';
  }
}
async function init(){
  await loadSharedData();
  CONFIG.bosses.forEach(b => BOSS_MAP[b.boss] = b);
  await poll();
  setInterval(() => { if (!document.hidden) poll(); }, POLL_MS);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) poll(); });
}
init();
</script>
</body>
</html>
